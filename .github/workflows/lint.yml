---
name: Lint
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  shellcheck-and-makefile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: hynek/setup-cached-uv@4300ec2180bc77d705e626a34e381b81a4772c51  # v2.5.0
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Install checkmake
        run: |
          go install github.com/checkmake/checkmake/cmd/checkmake@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint GitHub Actions workflows (actionlint + shellcheck)
        run: make shellcheck
      - name: Lint Makefile (checkmake)
        run: make makefile-lint
