---
name: Lint
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  shellcheck-and-makefile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hynek/setup-cached-uv@34e35d30f1ebc7421a5cc733bca38dcc62603960 # v2.6.0
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Install checkmake
        run: |
          go install github.com/checkmake/checkmake/cmd/checkmake@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint GitHub Actions workflows (actionlint + shellcheck)
        run: make shellcheck
      - name: Lint Makefile (checkmake)
        run: make makefile-lint
