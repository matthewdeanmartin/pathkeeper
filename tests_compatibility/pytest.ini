[pytest]
# Compatibility test suite — run with:
#
#   uv run pytest tests_compatibility/
#
#   # Against a Go build:
#   PK=./bin/pathkeeper uv run pytest tests_compatibility/
#
#   # Against a Java jar:
#   PK="java -jar pathkeeper.jar" uv run pytest tests_compatibility/
#
# The --pk option can also be passed directly:
#   uv run pytest tests_compatibility/ --pk ./bin/pathkeeper
#
addopts = -v --tb=short
markers =
    slow: tests that do full disk scans (skipped by default)
